[package]
name = "tpt-materials"
description = "Umbrella / facade crate re-exporting every tpt-mat-* domain crate behind optional features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
full = [
    "crystallography",
    "crystal-plasticity",
    "hardening",
    "texture",
    "phase-field",
    "grain-growth",
    "solidification",
    "diffusion",
    "phase-transform",
    "calphad",
    "homogenization",
    "rve",
    "composite-micro",
    "damage",
    "fatigue",
    "fatigue-micro",
    "corrosion",
    "creep",
    "heat-treatment",
    "welding",
    "battery",
    "additive",
    "database",
    "machine-learning",
    "fracture",
    "thermal",
    "dislocation",
    "precipitation",
    "hydrogen-embrittlement",
    "polymer",
    "hydrogel",
    "hydrogen-storage",
    "wasm",
]

crystallography = ["tpt-mat-crystallography"]
crystal-plasticity = ["tpt-mat-crystal-plasticity", "tpt-mat-hardening"]
hardening = ["tpt-mat-hardening"]
texture = ["tpt-mat-texture"]
phase-field = ["tpt-mat-phase-field"]
grain-growth = ["tpt-mat-grain-growth"]
solidification = ["tpt-mat-solidification"]
diffusion = ["tpt-mat-diffusion"]
phase-transform = ["tpt-mat-phase-transform"]
calphad = ["tpt-mat-calphad"]
homogenization = ["tpt-mat-homogenization"]
rve = ["tpt-mat-rve"]
composite-micro = ["tpt-mat-composite-micro"]
damage = ["tpt-mat-damage"]
fatigue = ["tpt-mat-fatigue"]
fatigue-micro = ["tpt-mat-fatigue-micro"]
corrosion = ["tpt-mat-corrosion"]
creep = ["tpt-mat-creep"]
heat-treatment = ["tpt-mat-heat-treatment"]
welding = ["tpt-mat-welding"]
battery = ["tpt-mat-battery"]
additive = ["tpt-mat-additive"]
database = ["tpt-mat-database"]
machine-learning = ["tpt-mat-machine-learning"]
fracture = ["tpt-mat-fracture"]
thermal = ["tpt-mat-thermal"]
dislocation = ["tpt-mat-dislocation"]
precipitation = ["tpt-mat-precipitation"]
hydrogen-embrittlement = ["tpt-mat-hydrogen-embrittlement"]
polymer = ["tpt-mat-polymer"]
hydrogel = ["tpt-mat-hydrogel"]
hydrogen-storage = ["tpt-mat-hydrogen-storage"]
wasm = ["tpt-mat-wasm"]

