[package]
name = "tpt-materials"
description = "Umbrella / facade crate re-exporting every tpt-mat-* domain crate behind optional features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
full = [
    "crystallography",
    "crystal-plasticity",
    "hardening",
    "texture",
    "phase-field",
    "grain-growth",
    "solidification",
    "diffusion",
    "phase-transform",
    "calphad",
    "homogenization",
    "rve",
    "composite-micro",
    "damage",
    "fatigue",
    "creep",
    "heat-treatment",
    "database",
    "wasm",
]

crystallography = ["crystallography_dep"]
crystal-plasticity = ["crystal_plasticity_dep", "hardening_dep"]
hardening = ["hardening_dep"]
texture = ["texture_dep"]
phase-field = ["phase_field_dep"]
grain-growth = ["grain_growth_dep"]
solidification = ["solidification_dep"]
diffusion = ["diffusion_dep"]
phase-transform = ["phase_transform_dep"]
calphad = ["calphad_dep"]
homogenization = ["homogenization_dep"]
rve = ["rve_dep"]
composite-micro = ["composite_micro_dep"]
damage = ["damage_dep"]
fatigue = ["fatigue_dep"]
creep = ["creep_dep"]
heat-treatment = ["heat_treatment_dep"]
database = ["database_dep"]
wasm = ["wasm_dep"]

[dependencies.crystallography_dep]
path = "../tpt-mat-crystallography"
version = "0.1"
optional = true
package = "tpt-mat-crystallography"

