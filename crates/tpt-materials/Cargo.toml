[package]
name = "tpt-materials"
description = "Umbrella / facade crate re-exporting every tpt-mat-* domain crate behind optional features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
full = [
    "crystallography",
    "crystal-plasticity",
    "hardening",
    "texture",
    "phase-field",
    "grain-growth",
    "solidification",
    "diffusion",
    "phase-transform",
    "calphad",
    "homogenization",
    "rve",
    "composite-micro",
    "damage",
    "fatigue",
    "creep",
    "heat-treatment",
    "database",
    "wasm",
]

crystallography = ["tpt-mat-crystallography"]
crystal-plasticity = ["tpt-mat-crystal-plasticity", "tpt-mat-hardening"]
hardening = ["tpt-mat-hardening"]
texture = ["tpt-mat-texture"]
phase-field = ["tpt-mat-phase-field"]
grain-growth = ["tpt-mat-grain-growth"]
solidification = ["tpt-mat-solidification"]
diffusion = ["tpt-mat-diffusion"]
phase-transform = ["tpt-mat-phase-transform"]
calphad = ["tpt-mat-calphad"]
homogenization = ["tpt-mat-homogenization"]
rve = ["tpt-mat-rve"]
composite-micro = ["tpt-mat-composite-micro"]
damage = ["tpt-mat-damage"]
fatigue = ["tpt-mat-fatigue"]
creep = ["tpt-mat-creep"]
heat-treatment = ["tpt-mat-heat-treatment"]
database = ["tpt-mat-database"]
wasm = ["tpt-mat-wasm"]

[dependencies.tpt-mat-crystallography]
path = "../tpt-mat-crystallography"
version = "0.1"
optional = true

