[workspace]
resolver = "2"
members = [
    "crates/tpt-testkit",
    "crates/tpt-math-linalg-fixed",
    "crates/tpt-science",
    "crates/tpt-mat-core",
    "crates/tpt-mat-constants",
    "crates/tpt-mat-crystallography",
    "crates/tpt-mat-additive",
    "crates/tpt-mat-battery",
    "crates/tpt-mat-corrosion",
    "crates/tpt-mat-welding",
    "crates/tpt-mat-machine-learning",
    "crates/tpt-mat-hardening",
    "crates/tpt-mat-crystal-plasticity",
    "crates/tpt-mat-texture",
    "crates/tpt-mat-phase-field",
    "crates/tpt-mat-grain-growth",
    "crates/tpt-mat-solidification",
    "crates/tpt-mat-diffusion",
    "crates/tpt-mat-phase-transform",
    "crates/tpt-mat-calphad",
    "crates/tpt-mat-homogenization",
    "crates/tpt-mat-rve",
    "crates/tpt-mat-composite-micro",
    "crates/tpt-mat-fatigue",
    "crates/tpt-mat-fatigue-micro",
    "crates/tpt-mat-creep",
    "crates/tpt-mat-damage",
    "crates/tpt-mat-heat-treatment",
    "crates/tpt-mat-database",
    "crates/tpt-mat-fracture",
    "crates/tpt-mat-thermal",
    "crates/tpt-mat-dislocation",
    "crates/tpt-mat-precipitation",
    "crates/tpt-mat-hydrogen-embrittlement",
    "crates/tpt-mat-polymer",
    "crates/tpt-mat-hydrogel",
    "crates/tpt-mat-hydrogen-storage",
    "crates/tpt-mat-wasm",
    "crates/tpt-mat-inverse",
    "crates/tpt-materials",
    "examples/fcc-single-crystal-tension",
    "examples/spinodal-decomposition",
    "examples/dendritic-solidification",
    "examples/diffusion-carbon-steel",
    "examples/phase-transform-jmak",
    "examples/calphad-binary-phase-diagram",
    "examples/homogenization-voigt-reuss",
    "examples/eshelby-inclusion",
    "examples/taylor-factor-fcc",
    "examples/heat-treatment-steel",
    "examples/database-material-search",
    "examples/fatigue-crack-initiation",
    "examples/corrosion-polarization",
    "examples/battery-electrode-degradation",
    "examples/additive-manufacturing-microstructure",
    "examples/welding-haz",
    "examples/ml-surrogate",
    "examples/rubber-elasticity",
    "examples/metal-hydride-pct",
    "examples/phase-field-fracture-notch",
    "examples/precipitation-age-hardening",
    "examples/composite-thermal-properties",
    "examples/dislocation-density-tension",
    "examples/hydrogen-embrittlement-notch",
    "examples/micro-to-macro-pipeline",
    "examples/backlog-modules-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-materials"
homepage = "https://github.com/tpt-solutions/tpt-materials"
documentation = "https://docs.rs/tpt-mat-core"
readme = "README.md"
keywords = ["materials-science", "crystal-plasticity", "phase-field", "homogenization", "calphad"]
categories = ["science", "simulation", "no-std"]
authors = ["TPT Solutions <[email protected]>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
num-traits = { version = "0.2", default-features = false }
tpt-testkit = { path = "crates/tpt-testkit", version = "0.1" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_in_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
doc_markdown = "allow"
wildcard_imports = "allow"
redundant_closure_for_method_calls = "allow"
missing_panics_doc = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
return_self_not_must_use = "allow"
unseparated_literal_suffix = "allow"
single_char_lifetime_names = "allow"
single_char_pattern_names = "allow"
needless_pass_by_value = "allow"
explicit_iter_loop = "allow"
float_cmp = "allow"
wrong_self_convention = "allow"
items_after_statements = "allow"
many_single_char_names = "allow"
upper_case_acronyms = "allow"
cast_lossless = "allow"